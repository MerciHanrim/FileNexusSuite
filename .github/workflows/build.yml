name: Build

# Introduced in v1.0.11 — runs build_pyinstaller.py on Windows + Python 3.10
# to produce a verifiable, automated build of dist/FileNexusSuite/ as a
# GitHub artifact.
#
# Design intent: satisfy SignPath OSS Sponsorship's technical requirement
#   "binary is a valid, automated build resulting from the source code
#    at the noted source code repository"
# by making every push reproducible via GitHub-hosted runners.
#
# Next track: signpath/github-action-submit-signing-request will be added
# once SignPath approval and organization-id are in place.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual trigger for build debugging

jobs:
  build:
    name: Build on Windows / Python 3.10
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        env:
          # GitHub Actions Windows runners use cp1252 (English locale) by default,
          # which cannot encode the box-drawing characters (╔═╗) printed by
          # build_pyinstaller.py. Forcing PYTHONIOENCODING=utf-8 makes Python's
          # stdout use UTF-8 so the script runs without UnicodeEncodeError.
          PYTHONIOENCODING: utf-8
        run: python build_pyinstaller.py

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist/FileNexusSuite/FileNexusSuite.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build output not found: $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Build output verified: FileNexusSuite.exe ($([math]::Round($size, 2)) MB)"
          $totalSize = (Get-ChildItem dist/FileNexusSuite -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Total dist size: $([math]::Round($totalSize, 0)) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileNexusSuite-${{ github.sha }}
          path: dist/FileNexusSuite/
          retention-days: 30
          if-no-files-found: error
