name: CI

# Introduced in v1.0.7 — runs test_file_nexus.py on Windows + Python 3.10
# to validate the test suite on a clean environment matching the developer's
# local setup (529 tests at introduction; current count tracked in CHANGELOG).
#
# Design intent: per TEST_MANAGEMENT_POLICY.md §2.1, automated tests catch
# repeating, structural defects.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual trigger for debugging or re-validating specific commits

jobs:
  test:
    name: Test on Windows / Python 3.10
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python test_file_nexus.py
